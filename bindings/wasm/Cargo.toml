[package]
name = "sovereigndrive-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WASM bindings for SovereignDrive Core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
sovereigndrive-engine = { path = "../../engine" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
